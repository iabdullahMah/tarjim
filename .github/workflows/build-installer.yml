# Builds Tarjim-Setup-<version>.exe on a Windows machine of GitHub's, with everything the
# installer carries: the program, its Python and libraries, the translation model, adb, and
# the TV and phone apps. The finished installer is installed silently and asked to test
# itself before it is published as a pre-release.
#
# Beside the installer it publishes the small update (Tarjim-Update-<version>.zip with
# update.json): the files that change between versions, which the installed program fetches
# and puts in place by itself (laptop/tarjim/update.py).
#
# It runs when started by hand (Actions > Build installer > Run workflow), and when this
# file or the version (laptop/tarjim/__init__.py) changes on a work branch.
name: Build installer

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/build-installer.yml"
      - "laptop/tarjim/__init__.py"   # the version: a new one is a new build

permissions:
  contents: write  # to publish the pre-release

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python environment
        working-directory: laptop
        run: uv sync

      # -- the translation model (not in git) ------------------------------------------------
      - name: Translation model (ready-made conversion)
        id: model
        continue-on-error: true
        working-directory: laptop
        run: uv run --with huggingface_hub python launcher/fetch_model.py

      - name: Translation model (converted here, if the ready-made one is gone)
        if: steps.model.outcome == 'failure'
        working-directory: laptop
        run: |
          $out = "..\models\opus-mt-tc-big-en-ar-ct2"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          uv run --no-project --python 3.12 --with ctranslate2 --with transformers --with torch --with sentencepiece --with sacremoses `
            ct2-transformers-converter --model Helsinki-NLP/opus-mt-tc-big-en-ar --output_dir $out --quantization int8
          if ($LASTEXITCODE -ne 0) { throw "converting the model failed" }
          uv run --with huggingface_hub python launcher/fetch_model.py

      # -- adb, and the two Android apps -----------------------------------------------------
      - name: adb (platform-tools)
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath .tools -Force
          Remove-Item pt.zip
          & .tools\platform-tools\adb.exe version

      - name: TV app
        working-directory: tv-app
        run: |
          .\gradlew.bat --no-daemon assembleDebug
          if ($LASTEXITCODE -ne 0) { throw "building the TV app failed" }

      - name: Phone remote app
        working-directory: phone-app
        run: |
          .\gradlew.bat --no-daemon assembleDebug
          if ($LASTEXITCODE -ne 0) { throw "building the phone app failed" }

      # -- tests (reported, not blocking: two of them depend on the machine's timing) ---------
      - name: Tests
        continue-on-error: true
        working-directory: laptop
        run: uv run pytest -q

      # -- the installer ---------------------------------------------------------------------
      - name: Tarjim.exe and the installer
        working-directory: laptop
        run: |
          uv sync --no-dev
          uv run --no-sync python launcher/build.py
          if ($LASTEXITCODE -ne 0) { throw "building Tarjim.exe failed" }
          uv run --no-sync python launcher/build_setup.py
          if ($LASTEXITCODE -ne 0) { throw "building the installer failed" }
          uv run --no-sync python launcher/build_update.py
          if ($LASTEXITCODE -ne 0) { throw "building the small update failed" }

      - name: Install it and let it test itself
        run: |
          $setup = (Get-ChildItem dist\Tarjim-Setup-*.exe)[0].FullName
          $folder = Join-Path $env:RUNNER_TEMP "TarjimTest"
          $p = Start-Process -FilePath $setup -ArgumentList "/S", "/D=$folder" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the silent install failed ($($p.ExitCode))" }
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath (Join-Path $folder "Tarjim.exe") -ArgumentList "--selftest", $report -Wait -PassThru
          Get-Content $report
          $facts = Get-Content $report -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $facts.ok) { throw "the installed program failed its own test" }
          foreach ($need in "model", "tv_apk", "phone_apk", "fonts") {
            if (-not $facts.$need) { throw "the installed program is missing: $need" }
          }
          # the installed copy translates one line with its own Python and model
          $py = Join-Path $folder "python\python.exe"
          Push-Location (Join-Path $folder "laptop")
          $env:PYTHONPATH = (Join-Path $folder "laptop") + ";" + (Join-Path $folder "laptop\.venv\Lib\site-packages")
          & $py -c "import sys; sys.stdout.reconfigure(encoding='utf-8'); from tarjim.translate import OpusTranslator; print(OpusTranslator().translate('Wait here, I will be right back.'))"
          if ($LASTEXITCODE -ne 0) { throw "the installed program could not translate" }
          Pop-Location

      # The small update, tried on that installation both ways a user can get it: extracted
      # over the folder by hand, and put in place by the program's own updater. After each,
      # the installed program must still pass its own test.
      - name: Try the small update on that installation
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "TarjimTest"
          $zip = (Get-ChildItem dist\Tarjim-Update-*.zip)[0].FullName
          $manifest = Get-Content dist\update.json -Raw | ConvertFrom-Json
          function Test-Installed($label) {
            $report = Join-Path $env:RUNNER_TEMP "selftest-$label.json"
            $p = Start-Process -FilePath (Join-Path $folder "Tarjim.exe") -ArgumentList "--selftest", $report -Wait -PassThru
            $facts = Get-Content $report -Raw | ConvertFrom-Json
            if ($p.ExitCode -ne 0 -or -not $facts.ok -or -not $facts.model) { Get-Content $report; throw "after the update ($label) the program failed its own test" }
            "ok after the update ($label)"
          }
          Expand-Archive $zip -DestinationPath $folder -Force
          Test-Installed "hand"
          $py = Join-Path $folder "python\python.exe"
          Push-Location (Join-Path $folder "laptop")
          $env:PYTHONPATH = (Join-Path $folder "laptop") + ";" + (Join-Path $folder "laptop\.venv\Lib\site-packages")
          $env:TARJIM_ZIP = $zip
          $env:TARJIM_SHA = $manifest.sha256
          & $py -c "import os; from pathlib import Path; from tarjim import update, paths; print(update.installed_runtime(), update.apply_zip(Path(os.environ['TARJIM_ZIP']), paths.REPO, sha256=os.environ['TARJIM_SHA']))"
          if ($LASTEXITCODE -ne 0) { throw "the program's own updater failed" }
          Pop-Location
          if (Test-Path (Join-Path $folder ".update")) { throw "the updater left its working folder behind" }
          Test-Installed "program"

      - name: Collect the files
        id: files
        run: |
          $version = (Select-String -Path laptop\tarjim\__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          Copy-Item tv-app\app\build\outputs\apk\debug\app-debug.apk "dist\Tarjim-TV-$version.apk"
          Copy-Item phone-app\app\build\outputs\apk\debug\app-debug.apk "dist\Tarjim-Phone-Remote-$version.apk"
          Remove-Item dist\setup-stub.exe -ErrorAction SilentlyContinue
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N0} MB  sha256 {2}" -f $_.Name, ($_.Length / 1MB), (Get-FileHash $_.FullName).Hash }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: tarjim-${{ steps.files.outputs.version }}
          path: dist/*
          compression-level: 0
          retention-days: 14

      - name: Publish as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.files.outputs.version }}-build${{ github.run_number }}
          name: Tarjim ${{ steps.files.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Built automatically from `${{ github.ref_name }}` at ${{ github.sha }}.
            The installer was installed silently on the build machine and passed its own test there,
            also after the small update was applied to it; it has not been tried with a TV or a console.
            An installed Tarjim (0.5.2 or later) fetches `Tarjim-Update-*.zip` by itself.
          files: dist/*
